name: 🕶️ visionOS Release

on:
  push:
    branches:
      - visionos-4.8
    tags:
      - visionos-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. visionos-v4.8.dev.1). Leave empty to publish a rolling "visionos-latest" release.
        type: string
        required: false
      prerelease:
        description: Mark the release as a pre-release.
        type: boolean
        default: true
      dry_run:
        description: Build and assemble everything, but publish nothing (assembled assets are kept as a run artifact).
        type: boolean
        default: false

concurrency:
  group: visionos-release|${{ github.ref_name }}|${{ inputs.tag }}
  cancel-in-progress: false

env:
  SCONS_FLAGS: >-
    production=yes
    module_text_server_fb_enabled=yes
    tests=no
    debug_symbols=no

jobs:
  # Resolve the release tag and the Godot version string once, so every job agrees.
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      godot-version: ${{ steps.meta.outputs.godot-version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry-run: ${{ steps.meta.outputs.dry-run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          godot_version=$(python3 -c '
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("version", "version.py")
          v = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(v)
          version = f"{v.major}.{v.minor}"
          if v.patch:
              version += f".{v.patch}"
          sys.stdout.write(f"{version}.{v.status}")
          ')
          echo "godot-version=$godot_version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            prerelease=true
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
            prerelease="${{ inputs.prerelease }}"
          else
            # Branch push or manual run without a tag: keep a single rolling release.
            tag="visionos-latest"
            prerelease=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing '$tag' for Godot $godot_version"

          dry_run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            dry_run=true
          fi
          echo "dry-run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "Dry run: $dry_run"

  # visionOS export templates: device + simulator, debug + release, bundled into visionos.zip.
  templates:
    name: visionOS export templates
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: visionos-release-templates
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Verify visionOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! xcrun --sdk xros --show-sdk-path > /dev/null 2>&1; then
            echo "visionOS SDK missing, downloading platform..."
            sudo xcodebuild -downloadPlatform visionOS
          fi
          echo "xros SDK: $(xcrun --sdk xros --show-sdk-path)"
          echo "xrsimulator SDK: $(xcrun --sdk xrsimulator --show-sdk-path)"

      - name: Compilation (device, template_debug)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64
          platform: visionos
          target: template_debug

      - name: Compilation (device, template_release)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64
          platform: visionos
          target: template_release

      - name: Compilation (simulator, template_debug)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 simulator=yes
          platform: visionos
          target: template_debug

      # The final build generates the Xcode project bundle from every library built above.
      - name: Compilation (simulator, template_release) + bundle
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 simulator=yes generate_bundle=yes
          platform: visionos
          target: template_release

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: visionos-release-templates
        continue-on-error: true

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -l bin/
          # The editor resolves export templates by platform name, so the bundle must be `visionos.zip`.
          mv bin/godot_visionos.zip visionos.zip
          unzip -l visionos.zip | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: visionos-templates
          path: visionos.zip
          retention-days: 7
          if-no-files-found: error

  # macOS editor used to run `--export-release visionOS` in downstream app CI.
  editor:
    name: macOS editor (universal)
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: visionos-release-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built ANGLE
        id: angle-sdk
        shell: bash
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        id: accesskit-sdk
        shell: bash
        run: |
          if python3 ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        shell: bash
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation (x86_64)
        uses: ./.github/actions/godot-build
        with:
          # Silence warning about Metal not being supported in x86_64 builds using `metal=no`.
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }} metal=no
          platform: macos
          target: editor

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: editor

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: visionos-release-editor
        continue-on-error: true

      - name: Package Godot.app
        shell: bash
        run: |
          set -euo pipefail
          lipo -create bin/godot.macos.editor.x86_64 bin/godot.macos.editor.arm64 -output bin/godot.macos.editor.universal
          strip -x bin/godot.macos.editor.universal
          chmod +x bin/godot.macos.editor.universal

          cp -r misc/dist/macos_tools.app Godot.app
          mkdir -p Godot.app/Contents/MacOS
          cp bin/godot.macos.editor.universal Godot.app/Contents/MacOS/Godot
          chmod +x Godot.app/Contents/MacOS/Godot

          # Ad-hoc signature, enough for local and CI use; not notarized.
          codesign --force --timestamp=none --options=runtime \
            --entitlements misc/dist/macos/editor.entitlements -s - Godot.app

          ditto -c -k --sequesterRsrc --keepParent Godot.app Godot_macos_editor.zip

          # Headless binary for `godot --headless --export-release` in downstream CI.
          cp bin/godot.macos.editor.universal godot.macos.editor.universal

          ./godot.macos.editor.universal --headless --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-editor
          path: |
            Godot_macos_editor.zip
            godot.macos.editor.universal
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # Export templates for every other platform, so `godot_export_templates.tpz` is a complete set
  # built from the same commit as the editor. Final files are uploaded as `tpl-*` artifacts using
  # the standard Godot export template file names; intermediate build outputs use `build-*`.
  # ---------------------------------------------------------------------------------------------

  # iOS export template: device arm64, debug + release, bundled into ios.zip (Xcode project).
  ios-templates:
    name: iOS export templates
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: visionos-release-ios-templates
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      # Provides MoltenVK.xcframework, which the iOS bundle ships and the exported Xcode project links.
      - name: Setup Vulkan SDK
        shell: bash
        run: |
          if ! sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "::warning::iOS: Vulkan SDK installation failed, the bundle will not include MoltenVK."
          fi
        continue-on-error: true

      - name: Compilation (template_debug)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64
          platform: ios
          target: template_debug

      # The final build generates the Xcode project bundle from every library built above.
      - name: Compilation (template_release) + bundle
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 generate_bundle=yes
          platform: ios
          target: template_release

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: visionos-release-ios-templates
        continue-on-error: true

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          mv bin/godot_ios.zip out/ios.zip
          unzip -l out/ios.zip | grep -E 'libgodot\.a|MoltenVK|godot_apple_embedded.xcodeproj/project.pbxproj'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tpl-ios
          path: out/*
          retention-days: 7
          if-no-files-found: error

  # macOS export template binaries, one job per architecture; bundled by `macos-templates`.
  macos-templates-build:
    name: macOS export templates (${{ matrix.arch }})
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Silence warning about Metal not being supported in x86_64 builds using `metal=no`.
          - arch: x86_64
            extra-flags: metal=no
          - arch: arm64
            extra-flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: visionos-release-macos-templates-${{ matrix.arch }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built ANGLE
        id: angle-sdk
        shell: bash
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        id: accesskit-sdk
        shell: bash
        run: |
          if python3 ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        shell: bash
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation (template_debug)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=${{ matrix.arch }} ${{ matrix.extra-flags }} vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: template_debug

      - name: Compilation (template_release)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=${{ matrix.arch }} ${{ matrix.extra-flags }} vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: template_release

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: visionos-release-macos-templates-${{ matrix.arch }}
        continue-on-error: true

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp bin/godot.macos.template_debug.${{ matrix.arch }} bin/godot.macos.template_release.${{ matrix.arch }} out/
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-templates-${{ matrix.arch }}
          path: out/*
          retention-days: 1
          if-no-files-found: error

  # Universal macos.zip (macos_template.app), assembled like `generate_bundle=yes` does for templates.
  macos-templates:
    name: macOS export templates (universal bundle)
    runs-on: macos-26
    needs: [macos-templates-build]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download template binaries
        uses: actions/download-artifact@v8
        with:
          pattern: build-macos-templates-*
          path: bin
          merge-multiple: true

      - name: Bundle macos_template.app
        shell: bash
        run: |
          set -euo pipefail
          ls -l bin
          cp -R misc/dist/macos_template.app bin/macos_template.app
          mkdir -p bin/macos_template.app/Contents/MacOS
          for target in debug release; do
            out="bin/macos_template.app/Contents/MacOS/godot_macos_${target}.universal"
            lipo -create "bin/godot.macos.template_${target}.x86_64" "bin/godot.macos.template_${target}.arm64" -output "$out"
            chmod +x "$out"
            lipo -info "$out"
          done
          mkdir -p out
          (cd bin && zip -q -r -y ../out/macos.zip macos_template.app)
          unzip -l out/macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tpl-macos
          path: out/*
          retention-days: 7
          if-no-files-found: error

  linux-templates:
    name: Linux export template (${{ matrix.arch }}, ${{ matrix.target }})
    # Stay one LTS before latest (same as linux_builds.yml) to keep the glibc requirement low.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: template_debug, name: linux_debug.x86_64, runner: ubuntu-22.04, python-arch: x64 }
          - { arch: x86_64, target: template_release, name: linux_release.x86_64, runner: ubuntu-22.04, python-arch: x64 }
          - { arch: arm64, target: template_debug, name: linux_debug.arm64, runner: ubuntu-22.04-arm, python-arch: arm64 }
          - { arch: arm64, target: template_release, name: linux_release.arm64, runner: ubuntu-22.04-arm, python-arch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-bin

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: visionos-release-linux-${{ matrix.arch }}-${{ matrix.target }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          python-arch: ${{ matrix.python-arch }}

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=${{ matrix.arch }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
          platform: linuxbsd
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: visionos-release-linux-${{ matrix.arch }}-${{ matrix.target }}
        continue-on-error: true

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp bin/godot.linuxbsd.${{ matrix.target }}.${{ matrix.arch }} out/${{ matrix.name }}
          strip out/${{ matrix.name }}
          chmod +x out/${{ matrix.name }}
          file out/${{ matrix.name }}
          ./out/${{ matrix.name }} --headless --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tpl-linux-${{ matrix.arch }}-${{ matrix.target }}
          path: out/*
          retention-days: 7
          if-no-files-found: error

  windows-templates:
    name: Windows export template (x86_64, ${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SCONS_CACHE_MSVC_CONFIG: true
      PYTHONIOENCODING: utf8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: template_debug, name: windows_debug_x86_64 }
          - { target: template_release, name: windows_release_x86_64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: visionos-release-windows-${{ matrix.target }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: visionos-release-windows-${{ matrix.target }}
        continue-on-error: true

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp bin/godot.windows.${{ matrix.target }}.x86_64.exe out/${{ matrix.name }}.exe
          # Console wrapper; the editor looks for `<template>_console.exe` next to the template.
          cp bin/godot.windows.${{ matrix.target }}.x86_64.console.exe out/${{ matrix.name }}_console.exe
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tpl-windows-${{ matrix.target }}
          path: out/*
          retention-days: 7
          if-no-files-found: error

  web-templates:
    name: Web export template (nothreads, ${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Keep in sync with web_builds.yml.
      EM_VERSION: 6.0.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: template_debug, name: web_nothreads_debug.zip }
          - { target: template_release, name: web_nothreads_release.zip }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true

      - name: Verify Emscripten setup
        run: |
          emcc -v

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: visionos-release-web-nothreads-${{ matrix.target }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} threads=no
          platform: web
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: visionos-release-web-nothreads-${{ matrix.target }}
        continue-on-error: true

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          zips=(bin/godot.web.${{ matrix.target }}.wasm32.nothreads*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one nothreads web template zip, found: ${zips[*]:-none}"
            exit 1
          fi
          cp "${zips[0]}" out/${{ matrix.name }}
          unzip -l out/${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tpl-web-${{ matrix.target }}
          path: out/*
          retention-days: 7
          if-no-files-found: error

  # Android native libraries, one job per ABI and target; packaged by `android-templates`.
  android-libs:
    name: Android native library (${{ matrix.arch }}, ${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [arm32, arm64, x86_64]
        target: [template_debug, template_release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: visionos-release-android-${{ matrix.arch }}-${{ matrix.target }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy
        shell: sh
        id: swappy_sdk
        run: |
          if python ./misc/scripts/install_swappy_android.py; then
            echo "SWAPPY_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Swappy installation failed, building without Swappy support."
            echo "SWAPPY_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=${{ matrix.arch }} swappy=${{ steps.swappy_sdk.outputs.SWAPPY_ENABLED }}
          platform: android
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: visionos-release-android-${{ matrix.arch }}-${{ matrix.target }}
        continue-on-error: true

      - name: List native libraries
        run: find platform/android/java/lib/libs -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-android-libs-${{ matrix.arch }}-${{ matrix.target }}
          path: platform/android/java/lib/libs
          retention-days: 1
          if-no-files-found: error

  # android_source.zip (Gradle build template) plus android_debug.apk / android_release.apk.
  android-templates:
    name: Android export templates
    runs-on: ubuntu-24.04
    needs: [android-libs]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Android Gradle project resolves the `scons` executable while configuring, even though
      # the native libraries are prebuilt by `android-libs`.
      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: build-android-libs-*
          path: platform/android/java/lib/libs
          merge-multiple: true

      - name: Generate Godot templates
        shell: bash
        run: |
          set -euo pipefail
          find platform/android/java/lib/libs -type f | sort
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -l bin/
          mkdir -p out
          cp bin/android_source.zip bin/android_debug.apk bin/android_release.apk out/
          for apk in out/android_debug.apk out/android_release.apk; do
            unzip -l "$apk" | grep 'lib/.*/libgodot_android.so'
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tpl-android
          path: out/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - templates
      - editor
      - ios-templates
      - macos-templates
      - linux-templates
      - windows-templates
      - web-templates
      - android-templates
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download visionOS templates
        uses: actions/download-artifact@v8
        with:
          name: visionos-templates
          path: artifacts

      - name: Download macOS editor
        uses: actions/download-artifact@v8
        with:
          name: macos-editor
          path: artifacts

      - name: Download other platform templates
        uses: actions/download-artifact@v8
        with:
          pattern: tpl-*
          path: platform-templates
          merge-multiple: true

      - name: Assemble release assets
        shell: bash
        env:
          GODOT_VERSION: ${{ needs.metadata.outputs.godot-version }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/visionos.zip release/visionos.zip
          cp artifacts/Godot_macos_editor.zip release/Godot_macos_editor.zip
          cp artifacts/godot.macos.editor.universal release/godot.macos.editor.universal

          # A .tpz that the editor / downstream CI can install as a complete template set.
          mkdir -p tpz/templates
          cp release/visionos.zip tpz/templates/visionos.zip
          echo "$GODOT_VERSION" > tpz/templates/version.txt
          (cd tpz && zip -r ../release/godot_visionos_export_templates.tpz templates)

          # Complete template set for every platform, using the standard Godot template file names.
          mkdir -p full/templates
          cp platform-templates/* full/templates/
          cp release/visionos.zip full/templates/visionos.zip
          echo "$GODOT_VERSION" > full/templates/version.txt
          chmod +x full/templates/linux_* full/templates/windows_*
          required=(
            version.txt visionos.zip ios.zip macos.zip
            linux_debug.x86_64 linux_release.x86_64 linux_debug.arm64 linux_release.arm64
            windows_debug_x86_64.exe windows_release_x86_64.exe
            web_nothreads_debug.zip web_nothreads_release.zip
            android_source.zip android_debug.apk android_release.apk
          )
          for f in "${required[@]}"; do
            if [ ! -s "full/templates/$f" ]; then
              echo "::error::Export template '$f' is missing or empty."
              exit 1
            fi
          done
          (cd full && zip -r -y ../release/godot_export_templates.tpz templates)
          unzip -l release/godot_export_templates.tpz

          (cd release && shasum -a 256 * > SHA256SUMS.txt)
          ls -l release

      - name: Write release notes
        shell: bash
        env:
          GODOT_VERSION: ${{ needs.metadata.outputs.godot-version }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          # Actions expands every dollar-double-brace expression in this script before bash runs, even
          # when backslash-escaped, which previously leaked a live token into the notes. Build the
          # literal from pieces so the raw workflow text never contains that sequence where it's printed.
          EXPR_OPEN='$''{{'
          cat > notes.md <<EOF
          visionOS build of Godot \`$GODOT_VERSION\` from \`${{ github.ref_name }}\` (\`${{ github.sha }}\`).

          ## Assets

          | Asset | Use |
          | --- | --- |
          | \`visionos.zip\` | visionOS export template. Drop into the editor's export templates directory. |
          | \`godot_visionos_export_templates.tpz\` | Same template, packaged as an installable \`.tpz\`. |
          | \`godot_export_templates.tpz\` | Every platform's export templates (visionOS, iOS, macOS, Linux x86_64/arm64, Windows x86_64, Web without threads, Android) from this commit. |
          | \`Godot_macos_editor.zip\` | macOS editor app bundle (universal, ad-hoc signed). |
          | \`godot.macos.editor.universal\` | Bare macOS editor binary for headless exports. |
          | \`SHA256SUMS.txt\` | Checksums for every asset above. |

          ## Use from another repository's CI

          \`\`\`yaml
          - name: Install Godot (visionOS)
            env:
              GH_TOKEN: ${EXPR_OPEN} secrets.GITHUB_TOKEN }}
            run: |
              gh release download "$TAG" --repo ${{ github.repository }} \\
                --pattern 'godot.macos.editor.universal' --pattern 'visionos.zip' --clobber
              chmod +x godot.macos.editor.universal
              sudo mv godot.macos.editor.universal /usr/local/bin/godot

              TEMPLATES="\$HOME/Library/Application Support/Godot/export_templates/$GODOT_VERSION"
              mkdir -p "\$TEMPLATES"
              mv visionos.zip "\$TEMPLATES/visionos.zip"

          - name: Export
            run: godot --headless --export-release "visionOS" build/App.xcodeproj
          \`\`\`

          > The editor bundle is ad-hoc signed and **not** notarized. On a developer Mac run
          > \`xattr -dr com.apple.quarantine Godot.app\` after unzipping.
          EOF

          if grep -qE 'gh[pousr]_[A-Za-z0-9]{16,}|github_pat_' notes.md; then
            echo "::error::Release notes contain what looks like a GitHub token; refusing to publish."
            exit 1
          fi
          cat notes.md

      # Dry run: keep the assembled release assets as a short-lived run artifact; publish nothing.
      - name: Upload assembled release (dry run)
        if: needs.metadata.outputs.dry-run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-release
          path: |
            release/*
            notes.md
          retention-days: 3
          if-no-files-found: error

      - name: Publish
        if: needs.metadata.outputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--title "Godot visionOS ${{ needs.metadata.outputs.godot-version }} ($TAG)" --notes-file notes.md --target "${{ github.sha }}")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          REPO="${{ github.repository }}"

          if [ "$TAG" = "visionos-latest" ]; then
            # Rolling release: upload everything to a draft first (drafts create no git tag),
            # then swap it in, so downstream never sees a release with partial assets.
            STAGING="visionos-latest-staging-${{ github.run_id }}-${{ github.run_attempt }}"
            gh release list --repo "$REPO" --limit 100 --json tagName,isDraft \
              --jq '.[] | select(.isDraft and (.tagName | startswith("visionos-latest-staging-"))) | .tagName' |
              while read -r stale; do gh release delete "$stale" --repo "$REPO" --yes || true; done
            gh release create "$STAGING" --repo "$REPO" --draft "${flags[@]}" release/*
            if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
              gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
            fi
            gh release edit "$STAGING" --repo "$REPO" --tag "$TAG" --draft=false
            exit 0
          fi

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # Versioned tag already published: refresh its assets in place.
            gh release upload "$TAG" --repo "$REPO" --clobber release/*
            exit 0
          fi

          gh release create "$TAG" --repo "$REPO" "${flags[@]}" release/*
