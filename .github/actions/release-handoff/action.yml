name: Release handoff
description: >-
  Pass files between jobs through a run-scoped draft GitHub Release instead of Actions artifact
  storage. Draft releases are only visible to repository collaborators and create no git tag.

inputs:
  release:
    description: Tag name of the draft handoff release (created by the workflow's metadata job).
    required: true
  upload:
    description: Newline-separated files to upload (replacing assets with the same name).
    default: ""
  download:
    description: Newline-separated asset names or glob patterns to download.
    default: ""
  dir:
    description: Directory to download into.
    default: .
  token:
    description: Token with contents write permission.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Transfer files
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        HANDOFF_RELEASE: ${{ inputs.release }}
        HANDOFF_UPLOAD: ${{ inputs.upload }}
        HANDOFF_DOWNLOAD: ${{ inputs.download }}
        HANDOFF_DIR: ${{ inputs.dir }}
      run: |
        set -euo pipefail

        retry() {
          local n
          for n in 1 2 3; do
            if "$@"; then
              return 0
            fi
            echo "::warning::Attempt $n failed: $*"
            sleep $((n * 15))
          done
          return 1
        }

        while IFS= read -r file; do
          [ -n "$file" ] || continue
          if [ ! -s "$file" ]; then
            echo "::error::Handoff file '$file' is missing or empty."
            exit 1
          fi
          echo "Uploading $file ($(wc -c < "$file") bytes) to $HANDOFF_RELEASE"
          retry gh release upload "$HANDOFF_RELEASE" "$file" --clobber
        done <<< "$HANDOFF_UPLOAD"

        patterns=()
        while IFS= read -r pattern; do
          [ -n "$pattern" ] || continue
          patterns+=(--pattern "$pattern")
        done <<< "$HANDOFF_DOWNLOAD"
        if [ "${#patterns[@]}" -gt 0 ]; then
          mkdir -p "$HANDOFF_DIR"
          retry gh release download "$HANDOFF_RELEASE" --dir "$HANDOFF_DIR" --clobber "${patterns[@]}"
          ls -l "$HANDOFF_DIR"
        fi
